name: Security

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A new advisory can land on a quiet week. Scan every Monday.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan the dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan the dependencies
        uses: MeterianHQ/meterian-github-action@9603528ad7eb3e76e7181d8d721bba25665a403d # v1.0.18
        with:
          oss: true
          cli_args: >-
            --min-security=90
            --min-stability=80
            --min-licensing=95
            --report-console=nocolor
            --report-sarif=report.sarif

      # The scan writes one report that holds both the security and the
      # stability findings. Two categories keep them apart on GitHub, so the
      # stability alerts can be dropped later without touching anything else.
      - name: Split the scan report
        id: split
        if: success() || failure()
        run: |
          if [ ! -f report.sarif ]; then
            echo "The scan produced no report." >&2
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          split() {
            jq --arg tag "$1" '
              .runs |= map(
                (.tool.driver.rules | map(select(.properties.tags | index($tag)))) as $keep
                | (.tool.driver.rules |= $keep)
                | (.results |= map(select(.ruleId as $id | $keep | any(.id == $id))))
              )' report.sarif > "$2"
          }
          split security  security.sarif
          split stability stability.sarif
          echo "produced=true" >> "$GITHUB_OUTPUT"

      - name: Publish the security findings
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: steps.split.outputs.produced == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: security.sarif
          category: meterian-security

      - name: Publish the stability findings
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: steps.split.outputs.produced == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: stability.sarif
          category: meterian-stability
